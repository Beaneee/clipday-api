spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clipday}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # 요즘 폰 사진은 10MB를 넘기기도 한다. 클라이언트가 줄여 보내지만,
      # 줄이지 못하는 형식도 있어 상한에 여유를 둔다.
      max-file-size: 30MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 크기 제한을 넘긴 요청도 본문을 끝까지 읽어야 413 응답이 클라이언트에 닿는다.
    # 기본값(2MB)이면 Tomcat이 나머지를 버리고 커넥션을 끊어서, 브라우저는
    # 413 대신 네트워크 오류를 받는다. -1은 제한 없음.
    max-swallow-size: -1

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}